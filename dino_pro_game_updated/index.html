
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Pro</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(#87CEEB,#E0F6FF);
    text-align:center;
}

#menu{
    padding:20px;
}

#ui{
    font-size:24px;
    margin:10px;
}

#game{
    width:900px;
    max-width:95%;
    height:350px;
    margin:auto;
    position:relative;
    overflow:hidden;
    border:3px solid #222;
    background:linear-gradient(#87CEEB,#c7f0ff);
    display:none;
}

#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:60px;
    background:#7ec850;
}

.cloud{
    position:absolute;
    background:white;
    border-radius:50px;
    opacity:.9;
}

#player{
    position:absolute;
    left:60px;
    bottom:60px;
    width:80px;
    height:80px;
    border-radius:50%;
    background:url("face.png") center/cover no-repeat;
    border:4px solid white;
    box-shadow:0 0 10px rgba(0,0,0,.3);
}

.cactus{
    position:absolute;
    bottom:60px;
    width:40px;
    height:90px;
    background:#1f9d55;
    border-radius:10px;
}

.cactus::before{
    content:"";
    position:absolute;
    width:18px;
    height:40px;
    background:#1f9d55;
    left:-12px;
    top:25px;
    border-radius:10px;
}

.cactus::after{
    content:"";
    position:absolute;
    width:18px;
    height:40px;
    background:#1f9d55;
    right:-12px;
    top:15px;
    border-radius:10px;
}

#jumpBtn{
    margin-top:10px;
    font-size:28px;
    padding:12px 30px;
}
</style>
</head>

<body>

<div id="menu">
    <h1>🦖 Dino Pro</h1>
    <button onclick="start()">START</button>
</div>

<div id="ui">
    ⭐ <span id="score">0</span>
    &nbsp;&nbsp;
    ❤️ <span id="lives">3</span>
</div>

<div id="game">

    <div id="ground"></div>

    <div class="cloud"
         style="left:100px;top:40px;width:90px;height:40px">
    </div>

    <div class="cloud"
         style="left:450px;top:70px;width:120px;height:45px">
    </div>

    <div id="player"></div>

</div>

<button id="jumpBtn" onclick="jump()">⬆️ Sakra</button>

<audio id="hitSound" src="hit.m4a"></audio>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");

const hitSound = document.getElementById("hitSound");

let score = 0;
let lives = 3;

let y = 60;
let velocity = 0;
let gravity = 0.8;
let jumping = false;

function start(){

    document.getElementById("menu").style.display = "none";
    game.style.display = "block";

    setInterval(()=>{
        score++;
        scoreText.innerText = score;
    },1000);

    spawn();
}

function jump(){

    if(jumping) return;

    jumping = true;
    velocity = 18;
}

document.addEventListener("keydown",(e)=>{
    if(e.code === "Space"){
        jump();
    }
});

setInterval(()=>{

    if(jumping){

        y += velocity;
        velocity -= gravity;

        if(y <= 60){
            y = 60;
            velocity = 0;
            jumping = false;
        }

        player.style.bottom = y + "px";
    }

},20);

function loseLife(){

    hitSound.currentTime = 0;
    hitSound.play();

    lives--;

    livesText.innerText = lives;

    if(lives <= 0){

        alert("Game Over! Score: " + score);

        location.reload();
    }
}

function spawn(){

    const cactus = document.createElement("div");
    cactus.className = "cactus";

    cactus.style.left = "900px";

    game.appendChild(cactus);

    let x = 900;
    let speed = 8 + Math.min(score / 20, 6);

    let alreadyHit = false;

    const move = setInterval(()=>{

        x -= speed;

        cactus.style.left = x + "px";

        const p = player.getBoundingClientRect();
        const c = cactus.getBoundingClientRect();

        const collision =
            p.right - 20 > c.left &&
            p.left + 20 < c.right &&
            p.bottom - 20 > c.top &&
            p.top + 20 < c.bottom;

        if(collision && !alreadyHit){

            alreadyHit = true;
            loseLife();
        }

        if(x < -100){

            cactus.remove();
            clearInterval(move);
        }

    },20);

    setTimeout(spawn,1500);
}

</script>

</body>
</html>
